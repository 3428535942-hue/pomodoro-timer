<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ kb_title }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/" class="brand">
            <span class="icon">🧠</span>
            {{ kb_title }}
        </a>
        <div class="nav-links">
            <form action="/search" method="get" style="margin:0">
                <input type="search" name="q" placeholder="搜索知识库…" value="{{ query|default('') }}">
            </form>
            <a href="/">浏览</a>
            <a href="/upload">上传</a>
            <a href="/graph">图谱</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <small>共 {{ page_count|default(0) }} 个页面 · 知识库服务</small>
    </footer>
</body>
</html>
