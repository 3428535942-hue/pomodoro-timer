{% extends "base.html" %}
{% block title %}上传视频 — {{ kb_title }}{% endblock %}

{% block content %}
<h2 style="font-size:1.4rem;font-weight:700;letter-spacing:-0.3px;margin-bottom:0.5rem">视频摄取</h2>
<p style="color:var(--color-text-muted);margin-bottom:1.5rem">上传视频文件，AI 将自动提取音频、识别关键帧、生成带时间戳的知识点卡片。</p>

<!-- 上传区域 -->
<div id="upload-zone" class="upload-zone" onclick="document.getElementById('file-input').click()">
    <div class="upload-icon">🎬</div>
    <h3 style="font-weight:600;margin-bottom:0.25rem">拖拽视频到此处或点击上传</h3>
    <p style="color:var(--color-text-muted);font-size:0.85rem">支持 MP4, MOV, AVI, MKV · 建议单视频 &lt; 90 分钟</p>
    <input id="file-input" type="file" accept="video/*" style="display:none" onchange="handleFile(this.files[0])">
</div>

<!-- 进度区域 -->
<div id="progress-area" style="display:none;margin-top:2rem">
    <div id="progress-steps" style="margin-bottom:1rem"></div>
    <div class="skeleton" id="progress-bar" style="height:6px;width:100%;border-radius:3px"></div>
    <p id="progress-text" style="text-align:center;color:var(--color-text-muted);font-size:0.8rem;margin-top:0.5rem"></p>
</div>

<!-- 结果区域 -->
<div id="results-area" style="display:none;margin-top:2rem"></div>

<script src="/static/upload.js"></script>
{% endblock %}
