{% extends "base.html" %}
{% block title %}页面不存在 — {{ kb_title }}{% endblock %}

{% block content %}
<div class="empty-state">
    <div class="illustration">📄</div>
    <h3>404 — 页面未找到</h3>
    <p><code>{{ path }}</code> 不存在。它可能被移动了，或者还未被收录。</p>
    <a href="/" class="btn btn-primary" style="margin-top:1rem">返回首页</a>
</div>
{% endblock %}
