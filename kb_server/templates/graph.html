{% extends "base.html" %}
{% block title %}知识图谱 — {{ kb_title }}{% endblock %}
{% block head %}
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
    /* ================================================================
       赛博朋克暗黑主题 — 知识图谱页面专属样式
       设计语言：深空背景 + 霓虹发光 + 毛玻璃面板 + 科技感动画
       ================================================================ */

    :root {
        --cyber-bg: #0a0a0f;
        --cyber-surface: rgba(15, 15, 30, 0.92);
        --cyber-border: rgba(99, 102, 241, 0.15);
        --cyber-accent: #6366f1;
        --cyber-glow: rgba(99, 102, 241, 0.3);
        --cyber-text: #b0b8d0;
        --cyber-text-dim: #5c6270;
    }

    /* 覆盖全局 body 背景 */
    body {
        background: var(--cyber-bg) !important;
    }
    body::before { display: none; }

    /* 顶栏 — 毛玻璃 + 底部霓虹线 */
    nav {
        background: rgba(10, 10, 20, 0.85) !important;
        backdrop-filter: blur(20px) saturate(180%);
        border-bottom: 1px solid var(--cyber-border) !important;
        box-shadow: 0 1px 0 rgba(99, 102, 241, 0.08);
    }
    nav .brand { color: #e0e0f0 !important; }
    nav .nav-links a { color: var(--cyber-text) !important; }
    nav .nav-links a:hover { color: #00e676 !important; background: rgba(0, 230, 118, 0.08) !important; }
    nav input[type="search"] {
        background: rgba(255,255,255,0.04) !important;
        border-color: var(--cyber-border) !important;
        color: var(--cyber-text) !important;
    }
    nav input[type="search"]:focus {
        border-color: #00e676 !important;
        box-shadow: 0 0 0 3px rgba(0, 230, 118, 0.12) !important;
    }

    /* 主区域 */
    main {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    /* 底部 */
    footer { color: var(--cyber-text-dim) !important; }

    /* ================================================================
       图谱布局
       ================================================================ */

    .graph-page {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 56px);
        position: relative;
    }

    /* 工具栏 — 顶部悬浮 */
    .graph-toolbar {
        position: absolute;
        top: 1rem;
        left: 1rem;
        right: 1rem;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        pointer-events: none;
    }
    .graph-toolbar > * {
        pointer-events: auto;
    }

    .graph-toolbar .title {
        font-size: 1.1rem;
        font-weight: 700;
        color: #e0e0f0;
        letter-spacing: -0.3px;
        text-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        margin-right: auto;
    }

    /* 搜索框 — 霓虹边框 */
    .graph-search-wrap {
        position: relative;
    }
    .graph-search-wrap input {
        padding: 0.55rem 0.9rem 0.55rem 2.2rem;
        border: 1px solid var(--cyber-border);
        border-radius: 24px;
        font-size: 0.85rem;
        font-family: 'Inter', sans-serif;
        background: var(--cyber-surface);
        color: var(--cyber-text);
        width: 200px;
        outline: none;
        transition: all 250ms;
    }
    .graph-search-wrap input:focus {
        border-color: #00e676;
        box-shadow: 0 0 16px rgba(0, 230, 118, 0.15);
    }
    .graph-search-wrap input::placeholder { color: var(--cyber-text-dim); }
    .graph-search-wrap::before {
        content: '⌕';
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--cyber-text-dim);
        font-size: 1rem;
    }
    .search-match-badge {
        display: none;
        font-size: 0.72rem;
        padding: 0.2rem 0.6rem;
        border-radius: 12px;
        font-weight: 600;
    }

    /* 统计 */
    .graph-stats {
        font-size: 0.8rem;
        color: var(--cyber-text-dim);
        white-space: nowrap;
    }

    /* ================================================================
       图谱画布容器
       ================================================================ */

    #graph-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        cursor: grab;
    }
    #graph-container:active { cursor: grabbing; }
    #graph-container svg { display: block; }

    /* ================================================================
       悬浮提示卡片
       ================================================================ */

    #node-tooltip {
        position: absolute;
        z-index: 30;
        pointer-events: none;
        background: rgba(10, 10, 25, 0.95);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(99, 102, 241, 0.25);
        border-radius: 12px;
        padding: 0.8rem 1rem;
        font-family: 'Inter', sans-serif;
        font-size: 0.8rem;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5),
                    0 0 20px rgba(99, 102, 241, 0.1);
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 180ms, transform 180ms;
        max-width: 240px;
    }
    #node-tooltip.visible { opacity: 1; transform: translateY(0); }
    #node-tooltip .tt-type {
        display: inline-block;
        padding: 0.15rem 0.55rem;
        border-radius: 10px;
        font-size: 0.65rem;
        font-weight: 600;
        text-transform: uppercase;
        margin-bottom: 0.4rem;
    }
    #node-tooltip .tt-label {
        font-weight: 700;
        color: #e0e0f0;
        margin-bottom: 0.25rem;
    }
    #node-tooltip .tt-summary {
        color: #8890a8;
        font-size: 0.73rem;
        line-height: 1.45;
    }
    #node-tooltip .tt-meta {
        color: #5c6270;
        font-size: 0.68rem;
        margin-top: 0.35rem;
    }

    /* ================================================================
       图例
       ================================================================ */

    #legend {
        position: absolute;
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        display: flex;
        gap: 1.5rem;
        padding: 0.5rem 1.2rem;
        background: var(--cyber-surface);
        border: 1px solid var(--cyber-border);
        border-radius: 20px;
    }

    /* ================================================================
       小地图
       ================================================================ */

    #minimap {
        position: absolute;
        bottom: 1rem;
        right: 1rem;
        z-index: 20;
        border: 1px solid var(--cyber-border);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    #minimap canvas { display: block; }

    /* ================================================================
       空状态 / 错误
       ================================================================ */

    #graph-container .empty-state {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
    }
    #graph-container .empty-state .illustration { font-size: 4rem; }
    #graph-container .empty-state h3 { color: var(--cyber-text); }
    #graph-container .empty-state p { color: var(--cyber-text-dim); }

    /* ================================================================
       响应式
       ================================================================ */

    @media (max-width: 768px) {
        .graph-toolbar { flex-wrap: wrap; }
        .graph-search-wrap input { width: 140px; }
        #legend { gap: 0.8rem; font-size: 0.7rem; padding: 0.35rem 0.8rem; }
        #minimap { width: 100px; height: 70px; }
        #minimap canvas { width: 100px; height: 70px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="graph-page">

    <!-- 工具栏 -->
    <div class="graph-toolbar">
        <span class="title">◈ 知识网络</span>
        <span class="graph-stats" id="stats">加载中…</span>
        <div class="graph-search-wrap">
            <input type="text" id="graph-search-input" placeholder="搜索节点…">
        </div>
        <span class="search-match-badge" id="match-badge"></span>
    </div>

    <!-- 图谱画布 -->
    <div id="graph-container"></div>

    <!-- 悬浮卡片 -->
    <div id="node-tooltip"></div>

    <!-- 图例 -->
    <div id="legend"></div>

    <!-- 小地图 -->
    <div id="minimap">
        <canvas id="minimap-canvas" width="160" height="110"></canvas>
    </div>

</div>

<script src="/static/graph.js"></script>
{% endblock %}
