[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-server"
version = "0.2.0"
description = "Personal AI knowledge base web server — 个人 AI 知识库 Web 服务"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "jinja2>=3.0",
    "aiofiles>=23.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
kb-server = "kb_server.app:main"

[tool.setuptools.packages.find]
include = ["kb_server*"]

[tool.ruff]
target-version = "py310"
exclude = [
    "__pycache__",
    ".venv",
    "venv",
    ".git",
    "kb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
]
ignore = [
    "E501",  # 行过长（中文注释）
]

[tool.pytest.ini_options]
testpaths = ["tests"]
