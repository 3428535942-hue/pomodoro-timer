[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "kb-server"
version = "0.1.0"
description = "Personal AI knowledge base web server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "jinja2>=3.0",
    "aiofiles>=23.0",
    "markdown-it-py>=3.0",
]

[project.scripts]
kb-server = "kb_server.app:main"
